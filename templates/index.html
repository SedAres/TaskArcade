<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence — time-chunk kanban calendar</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-50..200&display=swap">
<link rel="stylesheet" href="/style.css">
<script>window.__SETTINGS__ = {{ settings_json|safe }};
document.documentElement.dataset.theme = window.__SETTINGS__.theme || 'midnight';
document.documentElement.dataset.density = window.__SETTINGS__.density || 'cozy';
</script>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="tb-group tb-brand">
      <button id="sidebarToggle" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
        <span class="material-symbols-rounded">dock_to_right</span>
      </button>
      <div class="brand"><span class="brand-mark">◆</span><span class="brand-name">Cadence</span></div>
    </div>

    <div class="tb-group tb-nav">
      <button id="prevWindow" class="icon-btn" title="Previous"><span class="material-symbols-rounded">chevron_left</span></button>
      <button id="todayBtn" class="pill-btn" title="Jump to today">Today</button>
      <button id="nextWindow" class="icon-btn" title="Next"><span class="material-symbols-rounded">chevron_right</span></button>
      <span id="rangeLabel" class="range-label"></span>
    </div>

    <div class="tb-group tb-mode">
      <button id="modePill" class="mode-pill" title="Toggle Work / Free">
        <span class="mode-dot"></span>
        <span id="modeText">Free</span>
      </button>
      <span id="wagonStatus" class="wagon-status" hidden>
        <span class="material-symbols-rounded">cable_car</span>
        <span id="wagonStatusText">Wagon</span>
      </span>
    </div>

    <div class="tb-group tb-tools">
      <div class="zoom-wrap" title="Zoom (time scale)">
        <span class="material-symbols-rounded">zoom_out</span>
        <input id="zoomSlider" type="range" min="28" max="160" step="2">
        <span class="material-symbols-rounded">zoom_in</span>
      </div>
      <button id="refreshBtn" class="icon-btn" title="Refresh"><span class="material-symbols-rounded">refresh</span></button>
      <button id="settingsBtn" class="icon-btn" title="Settings"><span class="material-symbols-rounded">tune</span></button>
    </div>
  </header>

  <div id="body">
    <aside id="sidebar">
      <div class="sb-head">
        <span class="sb-title">Structure</span>
        <div class="sb-head-actions">
          <button id="addRootNode" class="icon-btn sm" title="New top-level node"><span class="material-symbols-rounded">add</span></button>
        </div>
      </div>
      <div id="nodeTree" class="node-tree"></div>
      <div class="sb-foot">
        <label class="switch-row">
          <span>Show archived</span>
          <input type="checkbox" id="showArchived">
        </label>
      </div>
    </aside>

    <main id="board">
      <div id="boardScroll" class="board-scroll"></div>
    </main>
  </div>
</div>

<!-- Node modal -->
<div class="overlay" id="nodeModalOverlay">
  <div class="modal" id="nodeModal">
    <div class="modal-head">
      <h3 id="nodeModalTitle">New node</h3>
      <button class="icon-btn sm" data-close><span class="material-symbols-rounded">close</span></button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Name</label>
        <input id="nodeName" class="text-input" type="text" maxlength="120" placeholder="e.g. Launch website">
      </div>

      <div class="field-row">
        <div class="field grow">
          <label>Type</label>
          <div class="segmented" id="nodeTypeSeg">
            <button data-v="category" type="button"><span class="material-symbols-rounded">folder</span>Category</button>
            <button data-v="project" type="button"><span class="material-symbols-rounded">rocket_launch</span>Project</button>
            <button data-v="list" type="button"><span class="material-symbols-rounded">checklist</span>List</button>
            <button data-v="task" type="button"><span class="material-symbols-rounded">task_alt</span>Task</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Icon</label>
        <div class="icon-picker">
          <input id="nodeIcon" class="text-input icon-input" type="text" placeholder="emoji or symbol_name" maxlength="40">
          <div class="icon-suggestions" id="emojiGrid"></div>
          <div class="icon-suggestions" id="symbolGrid"></div>
        </div>
      </div>

      <div class="field">
        <label>Effort <span class="muted">(visual only)</span> — <span id="effortVal">5</span>/10</label>
        <input id="nodeEffort" type="range" min="1" max="10" step="1">
      </div>

      <div class="field-row">
        <div class="field grow">
          <label>Estimate</label>
          <div class="time-pair">
            <input id="estH" class="text-input num" type="number" min="0" placeholder="h">
            <input id="estM" class="text-input num" type="number" min="0" max="59" placeholder="m">
          </div>
        </div>
        <div class="field grow">
          <label>Remaining</label>
          <div class="time-pair">
            <input id="remH" class="text-input num" type="number" min="0" placeholder="h">
            <input id="remM" class="text-input num" type="number" min="0" max="59" placeholder="m">
          </div>
        </div>
      </div>

      <div class="field plan-field">
        <label>Chunk plan</label>
        <div class="field-row">
          <select id="planMode" class="text-input">
            <option value="count">Fixed number of chunks</option>
            <option value="size">Fixed chunk size (min)</option>
          </select>
          <input id="planValue" class="text-input num" type="number" min="1" value="4">
          <button id="genChunksBtn" class="pill-btn" type="button">Generate chunks</button>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button id="archiveBtn" class="ghost-btn" type="button"></button>
      <div class="spacer"></div>
      <button id="deleteNodeBtn" class="danger-btn" type="button">Delete</button>
      <button id="saveNodeBtn" class="primary-btn" type="button">Save</button>
    </div>
  </div>
</div>

<!-- Chunk modal -->
<div class="overlay" id="chunkModalOverlay">
  <div class="modal" id="chunkModal">
    <div class="modal-head">
      <h3 id="chunkModalTitle">Chunk</h3>
      <button class="icon-btn sm" data-close><span class="material-symbols-rounded">close</span></button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field grow">
          <label>Duration (minutes)</label>
          <input id="chunkDuration" class="text-input num" type="number" min="1">
        </div>
        <div class="field grow">
          <label>Progress</label>
          <div class="progress-controls">
            <input id="chunkDoneRange" type="range" min="0" max="100" step="1">
            <span id="chunkDoneLabel" class="muted"></span>
          </div>
        </div>
      </div>
      <div class="quick-row">
        <button class="chip-btn" data-add="5">+5m</button>
        <button class="chip-btn" data-add="15">+15m</button>
        <button class="chip-btn" data-add="25">+25m</button>
        <button class="chip-btn" data-complete="1">Mark complete</button>
        <button class="chip-btn" data-complete="0">Reset</button>
      </div>

      <div class="field">
        <label>Linked nodes <span class="muted">(allocation %)</span></label>
        <div id="chunkLinks" class="chunk-links"></div>
        <div class="field-row">
          <select id="addLinkSelect" class="text-input grow"></select>
          <button id="addLinkBtn" class="pill-btn" type="button">Add</button>
        </div>
      </div>

      <div class="field split-field">
        <label>Split</label>
        <div class="field-row">
          <button class="pill-btn" id="splitEqualBtn" type="button">Equal parts</button>
          <input id="splitEqualN" class="text-input num" type="number" min="2" value="2">
        </div>
        <div class="field-row">
          <button class="pill-btn" id="splitSizeBtn" type="button">By size (min)</button>
          <input id="splitSizeN" class="text-input num" type="number" min="1" value="25">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button id="deleteChunkBtn" class="danger-btn" type="button">Delete</button>
      <div class="spacer"></div>
      <button id="saveChunkBtn" class="primary-btn" type="button">Done</button>
    </div>
  </div>
</div>

<!-- Settings slide-over -->
<div class="overlay" id="settingsOverlay">
  <div class="modal settings-modal" id="settingsModal">
    <div class="modal-head">
      <h3>Settings</h3>
      <button class="icon-btn sm" data-close><span class="material-symbols-rounded">close</span></button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Theme</label>
        <div class="theme-grid" id="themeGrid"></div>
      </div>
      <div class="field-row">
        <div class="field grow">
          <label>Density</label>
          <div class="segmented" id="densitySeg">
            <button data-v="cozy" type="button">Cozy</button>
            <button data-v="compact" type="button">Compact</button>
          </div>
        </div>
        <div class="field grow">
          <label>Day range</label>
          <div class="segmented" id="rangeSeg">
            <button data-v="3" type="button">3d</button>
            <button data-v="7" type="button">7d</button>
            <button data-v="14" type="button">14d</button>
          </div>
        </div>
      </div>
      <label class="switch-row">
        <span>Sidebar open by default</span>
        <input type="checkbox" id="sidebarDefaultChk">
      </label>

      <hr class="sep">
      <div class="field">
        <label>Workspace</label>
        <div class="field-row">
          <input id="workspaceCode" class="text-input grow" type="text" readonly>
          <button id="copyLinkBtn" class="pill-btn" type="button">Copy link</button>
        </div>
        <p class="hint">Open this same link on another device to see the same board.</p>
      </div>

      <hr class="sep">
      <div class="field">
        <label>Wagon Sync <span class="muted">(external session source)</span></label>
        <label class="switch-row">
          <span>Enable Wagon sync</span>
          <input type="checkbox" id="wagonEnabled">
        </label>
        <div class="field-row">
          <input id="wagonBaseUrl" class="text-input grow" type="text" placeholder="http://127.0.0.1:8787">
        </div>
        <div class="field-row">
          <label class="inline-label">Poll every</label>
          <input id="wagonPoll" class="text-input num" type="number" min="3">
          <span class="muted">sec</span>
        </div>
        <p class="hint" id="wagonHint">Wagon: idle</p>
      </div>
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button id="saveSettingsBtn" class="primary-btn" type="button">Save settings</button>
    </div>
  </div>
</div>

<!-- Rollover modal -->
<div class="overlay" id="rolloverOverlay">
  <div class="modal rollover-modal" id="rolloverModal">
    <div class="modal-head">
      <h3>Yesterday's leftovers</h3>
      <button class="icon-btn sm" data-close><span class="material-symbols-rounded">close</span></button>
    </div>
    <div class="modal-body">
      <p class="hint">A few chunks from past days were never finished. Decide what happens to them.</p>
      <div id="rolloverList" class="rollover-list"></div>
    </div>
    <div class="modal-foot wrap">
      <button class="pill-btn" data-action="move_today" type="button">Move to Today</button>
      <button class="pill-btn" data-action="not_done" type="button">Mark Not done</button>
      <button class="pill-btn" data-action="done" type="button">Mark Done</button>
      <button class="pill-btn" data-action="keep_split" type="button">Keep spent, reschedule rest</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script src="/script.js"></script>
</body>
</html>
