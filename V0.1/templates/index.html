<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flowline — Duration-Based Timeline</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="app-shell">

  <!-- ===================== TOP BAR ===================== -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-diagram-project"></i></div>
      <div class="brand-text">
        <h1>Flowline</h1>
        <span>virtual-day timeline</span>
      </div>
    </div>

    <div class="topbar-center">
      <button id="modeToggleBtn" class="mode-pill mode-unknown" title="Toggle work / free mode">
        <span class="mode-dot"></span>
        <span id="modeLabel">mode: unknown</span>
      </button>
    </div>

    <div class="topbar-actions">
      <button id="finishDayBtn" class="btn btn-finish">
        <i class="fa-solid fa-forward"></i> Finish Day
      </button>
      <button id="settingsBtn" class="btn btn-icon" title="Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <!-- ===================== ACTIVE TASK PANEL ===================== -->
  <section class="active-panel" id="activePanel">
    <div class="active-ring-wrap">
      <svg id="ringSvg" class="ring-svg" viewBox="0 0 160 160">
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9775FA" />
            <stop offset="100%" stop-color="#4DABF7" />
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="80" cy="80" r="68"></circle>
        <circle id="ringProgress" class="ring-progress" cx="80" cy="80" r="68"></circle>
      </svg>
      <div class="ring-center">
        <span id="ringTime">--</span>
        <small id="ringSub">remaining</small>
      </div>
    </div>

    <div class="active-info">
      <div class="active-meta">
        <span id="activeDayLabel" class="chip chip-day">Day 1</span>
        <span id="activeTagChip" class="chip chip-tag">#tag</span>
      </div>
      <h2 id="activeTitle">No active task</h2>
      <p id="activeSubtitle">Add tasks below or finish the day to see what's next.</p>
      <div class="active-buttons">
        <button id="doneBtn" class="btn btn-done"><i class="fa-solid fa-check"></i> Done</button>
        <button id="skipBtn" class="btn btn-skip"><i class="fa-solid fa-forward-step"></i> Skip</button>
      </div>
    </div>
  </section>

  <!-- ===================== CONTROLS ===================== -->
  <section class="controls-row">
    <div class="view-switch" id="viewSwitch">
      <button class="view-btn" data-view="today">Today</button>
      <button class="view-btn" data-view="3days">Next 3 Days</button>
      <button class="view-btn" data-view="week">Week</button>
      <button class="view-btn" data-view="custom">Custom</button>
      <input type="number" id="customDaysInput" min="1" max="30" value="4" class="custom-days-input" />
    </div>

    <button id="toggleBulkBtn" class="btn btn-secondary">
      <i class="fa-solid fa-paste"></i> Bulk Add Tasks
    </button>
  </section>

  <!-- ===================== BULK ADD PANEL ===================== -->
  <section class="bulk-panel" id="bulkPanel">
    <div class="bulk-header">
      <h3>Bulk Paste Tasks</h3>
      <div class="bulk-day-select-wrap">
        <label for="bulkDaySelect">Add to day:</label>
        <select id="bulkDaySelect"></select>
      </div>
    </div>
    <textarea id="bulkTextarea" placeholder="Vacuum the house #c 1h
Study English #s 60m
Study Geography #s 1h25m
Do homework #s 180m
Watch a movie #f 2h20m"></textarea>
    <div class="bulk-footer">
      <span id="bulkError" class="bulk-error"></span>
      <button id="bulkSubmitBtn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Tasks</button>
    </div>
  </section>

  <!-- ===================== CALENDAR ===================== -->
  <main class="calendar-wrap">
    <div id="calendarColumns" class="calendar-columns"></div>
  </main>

</div>

<!-- ===================== SETTINGS MODAL ===================== -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h3><i class="fa-solid fa-gear"></i> Settings</h3>
      <button id="closeSettingsBtn" class="btn btn-icon"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="modal-body">
      <div class="settings-block">
        <label class="settings-label">External Server Base URL</label>
        <div class="settings-row">
          <input type="text" id="serverUrlInput" placeholder="http://127.0.0.1:2230" />
          <button id="saveServerUrlBtn" class="btn btn-primary">Save</button>
        </div>
        <p class="settings-hint">Polled every 10s at <code>/api/state</code> for the current work/free mode.</p>
      </div>

      <div class="settings-block">
        <label class="settings-label">Tags &amp; Colors</label>
        <div id="tagList" class="tag-list"></div>
        <div class="settings-row">
          <input type="text" id="newTagInput" placeholder="new tag name (no #)" />
          <button id="addTagBtn" class="btn btn-primary">Add Tag</button>
        </div>
        <div id="paletteSwatches" class="palette-swatches"></div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== EDIT TASK MODAL ===================== -->
<div class="modal-overlay" id="editModal">
  <div class="modal modal-small">
    <div class="modal-header">
      <h3><i class="fa-solid fa-pen"></i> Edit Task</h3>
      <button id="closeEditBtn" class="btn btn-icon"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <label class="settings-label">Title</label>
      <input type="text" id="editTitleInput" />

      <label class="settings-label">Tag</label>
      <input type="text" id="editTagInput" placeholder="e.g. s" />

      <label class="settings-label">Duration (e.g. 1h25m, 90m)</label>
      <input type="text" id="editDurationInput" />

      <div class="modal-footer">
        <button id="deleteTaskBtn" class="btn btn-danger"><i class="fa-solid fa-trash"></i> Delete</button>
        <button id="saveTaskBtn" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save</button>
      </div>
    </div>
  </div>
</div>

<script src="/script.js"></script>
</body>
</html>
